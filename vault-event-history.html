  <script>
    const VAULT_CATEGORIES = [
      { key: "ALL",           label: "ALL ARCHIVES",       color: "#a78bfa" },
      { key: "SKIRMISH",      label: "SKIRMISH",           color: "#4caf50" },
      { key: "SECTOR_BREACH", label: "SECTOR BREACH",      color: "#ff9800" },
      { key: "HOLDOUT",       label: "HOLDOUT",            color: "#00bcd4" },
      { key: "OPERATIONS",    label: "OPERATIONS",         color: "#e53935" },
      { key: "SHADOW_OPS",    label: "SHADOW OPS",         color: "#6b74d6" },
      { key: "WARPATH",       label: "WARPATH",            color: "#ab47bc" },
      { key: "UPGRADE_SALES", label: "UPGRADE & SALES",    color: "#38b2a6" }
    ];

    const MONTH_MAP = {
      jan: { num: 1,  short: "JAN", full: "January" },
      feb: { num: 2,  short: "FEB", full: "February" },
      mar: { num: 3,  short: "MAR", full: "March" },
      apr: { num: 4,  short: "APR", full: "April" },
      may: { num: 5,  short: "MAY", full: "May" },
      jun: { num: 6,  short: "JUN", full: "June" },
      jul: { num: 7,  short: "JUL", full: "July" },
      aug: { num: 8,  short: "AUG", full: "August" },
      sep: { num: 9,  short: "SEP", full: "September" },
      oct: { num: 10, short: "OCT", full: "October" },
      nov: { num: 11, short: "NOV", full: "November" },
      dec: { num: 12, short: "DEC", full: "December" }
    };

    let activeCategoryFilter = "ALL";
    let activeGroupMode = "EVENT";
    let discoveredVaultItems = [];

    function parseVaultFilename(fileName) {
      const cleanName = String(fileName || "").trim();
      const lower = cleanName.toLowerCase();
      const ignored = ["command-center.html", "hub-home.html", "2026-calendar.html", "vault-event-history.html", "building-briefs.html", "unit-briefs.html", "whats-broken.html", "report-war-crimes.html"];
      if (!lower.endsWith(".html") || ignored.includes(lower)) {
        return null;
      }

      let catKey = "OPERATIONS";
      if (lower.includes("skirmish")) catKey = "SKIRMISH";
      else if (lower.includes("sector-breach") || lower.includes("breach")) catKey = "SECTOR_BREACH";
      else if (lower.includes("holdout")) catKey = "HOLDOUT";
      else if (lower.includes("shadow-ops") || lower.includes("shadow_ops") || lower.includes("shadowops")) catKey = "SHADOW_OPS";
      else if (lower.includes("warpath")) catKey = "WARPATH";
      else if (lower.includes("operation") || lower.includes("nightmare")) catKey = "OPERATIONS";
      else if (lower.includes("upgrade") || lower.includes("building-sale") || lower.includes("sale-value")) catKey = "UPGRADE_SALES";
      else return null;

      let year = 2026;
      let monthNum = 0;
      let monthShort = "2026";
      let monthFull = "2026";
      let restSlug = cleanName.replace(/\.html$/i, "");

      const m1 = restSlug.match(/^(\d{4})-(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)-(.+)$/i);
      const m2 = !m1 ? restSlug.match(/^(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)-(.+)$/i) : null;

      if (m1) {
        year = parseInt(m1[1], 10);
        const mInfo = MONTH_MAP[m1[2].toLowerCase()];
        if (mInfo) { monthNum = mInfo.num; monthShort = mInfo.short; monthFull = mInfo.full; }
        restSlug = m1[3];
      } else if (m2) {
        const mInfo = MONTH_MAP[m2[1].toLowerCase()];
        if (mInfo) { monthNum = mInfo.num; monthShort = mInfo.short; monthFull = mInfo.full; }
        restSlug = m2[2];
      }

      const readableTitle = restSlug
        .replace(/=/g, ": ")
        .replace(/-/g, " ")
        .replace(/\boperation\s+/i, "OPERATION: ")
        .replace(/\bnightmare\s+/i, "NIGHTMARE: ")
        .replace(/\bshadow\s+ops\s*:?\s*/i, "SHADOW OPS: ")
        .toUpperCase();

      const dateBadge = monthNum > 0 ? `${monthShort} ${year}` : `${year}`;
      const monthGroupTitle = monthNum > 0 ? `${monthFull.toUpperCase()} ${year}` : `${year} ARCHIVES`;
      const sortScore = (year * 100) + monthNum;

      return {
        fileName: cleanName,
        url: `./vault/${encodeURIComponent(cleanName)}`,
        catKey,
        year,
        monthNum,
        dateBadge,
        monthGroupTitle,
        title: readableTitle,
        fullLabel: `${dateBadge} • ${readableTitle}`,
        sortScore
      };
    }

    async function discoverVaultDirectoryFiles() {
      const fileSet = new Set();
      if (window.WTR_DIRECTORY_MANIFEST && Array.isArray(window.WTR_DIRECTORY_MANIFEST.vaultFiles)) {
        window.WTR_DIRECTORY_MANIFEST.vaultFiles.forEach(f => fileSet.add(f));
      }

      if (window.location.protocol.startsWith("http")) {
        try {
          const resp = await fetch("./vault/", { cache: "no-store" });
          if (resp.ok) {
            const text = await resp.text();
            const doc = new DOMParser().parseFromString(text, "text/html");
            doc.querySelectorAll("a[href]").forEach(a => {
              const href = decodeURIComponent(a.getAttribute("href") || "").split("?")[0].split("#")[0];
              const base = href.split("/").filter(Boolean).pop() || "";
              if (base.toLowerCase().endsWith(".html")) fileSet.add(base);
            });
          }
          const ghResp = await fetch("https://api.github.com/repos/HighAnxiety-Labs/watchtower-data-hub/contents/vault", { cache: "no-store" });
          if (ghResp.ok) {
            const ghItems = await ghResp.json();
            if (Array.isArray(ghItems)) {
              const htmlFiles = ghItems
                .filter(it => it && it.type === "file" && String(it.name || "").toLowerCase().endsWith(".html"))
                .map(it => it.name);
              if (htmlFiles.length > 0) {
                fileSet.clear();
                htmlFiles.forEach(f => fileSet.add(f));
              }
            }
          }
        } catch (e) {}
      }

      discoveredVaultItems = Array.from(fileSet)
        .map(parseVaultFilename)
        .filter(Boolean)
        .sort((a, b) => (b.sortScore - a.sortScore) || a.title.localeCompare(b.title));

      renderCategoryPills();
      renderVaultDirectory();
    }

    function renderCategoryPills() {
      const row = document.getElementById("vaultCategoryPills");
      const totalBadge = document.getElementById("vaultTotalCountBadge");
      if (!row) return;

      const counts = { ALL: discoveredVaultItems.length };
      VAULT_CATEGORIES.forEach(c => {
        if (c.key !== "ALL") counts[c.key] = discoveredVaultItems.filter(i => i.catKey === c.key).length;
      });

      if (totalBadge) {
        totalBadge.textContent = `${discoveredVaultItems.length} ARCHIVED FILES IN VAULT`;
      }

      row.innerHTML = VAULT_CATEGORIES.map(c => {
        const cnt = counts[c.key] || 0;
        const isAct = activeCategoryFilter === c.key;
        return `
          <button type="button" class="cat-pill-btn ${isAct ? 'active' : ''}" style="--pill-color:${c.color};" onclick="selectVaultCategory('${c.key}')">
            <span>${c.label}</span>
            <span style="opacity:0.85;">(${cnt})</span>
          </button>
        `;
      }).join("");
    }

    function selectVaultCategory(catKey) {
      activeCategoryFilter = catKey;
      const catMeta = VAULT_CATEGORIES.find(c => c.key === catKey) || VAULT_CATEGORIES[0];
      const heading = document.getElementById("vaultPageHeading");
      if (heading) {
        heading.textContent = catKey === "ALL" ? "EVENT HISTORY ARCHIVE (ALL CATEGORIES)" : `${catMeta.label} — EVENT HISTORY`;
      }
      renderCategoryPills();
      renderVaultDirectory();
    }

    function setVaultGroupMode(mode) {
      activeGroupMode = mode;
      document.getElementById("btnGroupEvent")?.classList.toggle("active", mode === "EVENT");
      document.getElementById("btnGroupYear")?.classList.toggle("active", mode === "YEAR");
      renderVaultDirectory();
    }

    function toggleVaultItemDrawer(rowId, fileUrl) {
      const drawer = document.getElementById(`drawer-${rowId}`);
      const iframe = document.getElementById(`iframe-${rowId}`);
      const btn = document.getElementById(`btn-${rowId}`);
      if (!drawer || !iframe) return;

      const isOpen = drawer.classList.toggle("open");
      if (isOpen) {
        if (!iframe.getAttribute("src") || iframe.getAttribute("src") === "about:blank") {
          iframe.setAttribute("src", fileUrl);
        }
        if (btn) btn.innerHTML = "▲ Collapse Brief";
      } else {
        if (btn) btn.innerHTML = "🖥️ Expand in Iframe ▼";
      }
    }

    function popOutVaultFile(fileUrl) {
      const w = 1160, h = 880;
      const left = Math.max(0, (window.screen.width - w) / 2);
      const top = Math.max(0, (window.screen.height - h) / 2);
      const win = window.open(fileUrl, "_blank", `width=${w},height=${h},top=${top},left=${left},resizable=yes,scrollbars=yes`);
      if (!win) window.open(fileUrl, "_blank");
    }

    function renderVaultDirectory() {
      const container = document.getElementById("vaultDirectoryBody");
      if (!container) return;

      const filtered = activeCategoryFilter === "ALL"
        ? discoveredVaultItems
        : discoveredVaultItems.filter(i => i.catKey === activeCategoryFilter);

      if (filtered.length === 0) {
        container.innerHTML = `<div style="padding:28px; text-align:center; font-family:monospace; color:var(--text-muted); border:1px dashed var(--border-metal); border-radius:4px;">No archived files found for this category in <code>published/vault/</code>.</div>`;
        return;
      }

      const groups = [];
      if (activeGroupMode === "YEAR") {
        const byMonth = new Map();
        filtered.forEach(item => {
          if (!byMonth.has(item.monthGroupTitle)) {
            byMonth.set(item.monthGroupTitle, { title: `📅 ${item.monthGroupTitle}`, color: "#a78bfa", items: [] });
          }
          byMonth.get(item.monthGroupTitle).items.push(item);
        });
        byMonth.forEach(g => groups.push(g));
      } else {
        VAULT_CATEGORIES.filter(c => c.key !== "ALL").forEach(cat => {
          const catItems = filtered.filter(i => i.catKey === cat.key);
          if (catItems.length > 0) {
            groups.push({ title: `📂 ${cat.label}`, color: cat.color, items: catItems });
          }
        });
      }

      let rowCounter = 0;
      container.innerHTML = groups.map(grp => {
        const rowsHtml = grp.items.map(item => {
          rowCounter++;
          const rowId = `vrow-${rowCounter}`;
          const catMeta = VAULT_CATEGORIES.find(c => c.key === item.catKey) || VAULT_CATEGORIES[0];
          return `
            <div class="vault-event-row">
              <div class="vault-label-bar" onclick="toggleVaultItemDrawer('${rowId}', '${item.url}')">
                <div class="vault-label-left">
                  <span class="vault-date-badge">${item.dateBadge}</span>
                  <span class="vault-cat-tag" style="background:${catMeta.color}22; color:${catMeta.color}; border:1px solid ${catMeta.color}88;">${catMeta.label}</span>
                  <span class="vault-event-title">${item.title}</span>
                  <span class="vault-file-hint">(${item.fileName})</span>
                </div>
                <div class="vault-label-actions" onclick="event.stopPropagation();">
                  <button type="button" class="btn-vault-action" id="btn-${rowId}" onclick="toggleVaultItemDrawer('${rowId}', '${item.url}')">🖥️ Expand in Iframe ▼</button>
                  <button type="button" class="btn-vault-action popout" onclick="popOutVaultFile('${item.url}')">↗ Pop-Out Full Page</button>
                </div>
              </div>
              <div class="vault-iframe-drawer" id="drawer-${rowId}">
                <div class="vault-iframe-Drawer-bar">
                  <span>🖥️ ARCHIVE VIEWPORT // ${item.fullLabel}</span>
                  <div style="display:flex; gap:8px;">
                    <button type="button" class="btn-vault-action popout" onclick="popOutVaultFile('${item.url}')">↗ Pop-Out Full Window</button>
                    <button type="button" class="btn-vault-action" onclick="toggleVaultItemDrawer('${rowId}', '${item.url}')">✕ Collapse</button>
                  </div>
                </div>
                <iframe class="vault-embed-iframe" id="iframe-${rowId}" src="about:blank" loading="lazy"></iframe>
              </div>
            </div>
          `;
        }).join("");

        return `
          <div class="vault-group-box">
            <div class="vault-group-header" style="--grp-color:${grp.color};">
              <span>${grp.title}</span>
              <span style="font-family:monospace; font-size:12px; color:var(--text-gold);">${grp.items.length} ${grp.items.length === 1 ? 'FILE' : 'FILES'}</span>
            </div>
            <div class="vault-items-list">${rowsHtml}</div>
          </div>
        `;
      }).join("");
    }

    (function initFromQuery() {
      const params = new URLSearchParams(window.location.search);
      const cat = (params.get("category") || "").toUpperCase().trim();
      if (cat && VAULT_CATEGORIES.some(c => c.key === cat)) {
        activeCategoryFilter = cat;
        const catMeta = VAULT_CATEGORIES.find(c => c.key === cat);
        const heading = document.getElementById("vaultPageHeading");
        if (heading && catMeta && cat !== "ALL") {
          heading.textContent = `${catMeta.label} — EVENT HISTORY`;
        }
      }
      const grp = (params.get("group") || "").toUpperCase().trim();
      if (grp === "YEAR" || grp === "EVENT") {
        setVaultGroupMode(grp);
      }
      discoverVaultDirectoryFiles();
    })();
  </script>
</body>
</html>
