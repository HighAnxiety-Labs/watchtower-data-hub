  <script>
  (function() {
    var isKnown = false;
    var startMs = NaN;
    var clockEl = document.getElementById("liveEventCountdown");
    function tick() {
      if (!isKnown || isNaN(startMs)) {
        clockEl.textContent = "0d 0h 00m 0s";
        return;
      }
      var diff = Math.max(0, startMs - Date.now());
      var d = Math.floor(diff / 86400000);
      var h = Math.floor((diff % 86400000) / 3600000);
      var m = Math.floor((diff % 3600000) / 60000);
      var s = Math.floor((diff % 60000) / 1000);
      var mPad = m < 10 ? "0" + m : "" + m;
      clockEl.textContent = d + "d " + h + "h " + mPad + "m " + s + "s";
    }
    tick();
  })();
  </script>
